name: Relay mock Steam tests (Windows)

on:
  push:
    branches:
      - test/relay-windows-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-steam:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build relay, mock Steam and helper tests
        shell: cmd
        run: call relay\build.cmd
      - name: Exercise single guest and intruder rejection
        run: python relay/selftest.py
      - name: Exercise two guests, timeout and rejoin
        run: python relay/multi_peer_test.py --check-port-retry
